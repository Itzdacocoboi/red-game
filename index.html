<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* 1. Remove default browser spacing */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* 2. Make the box span the full width and height */
        .red-box {
            width: 100vw;       /* 100% of the viewport width */
            height: 100vh;      /* 100% of the viewport height */
            background-color: #FF0000; 
        }
    </style>
</head>
<body>
    <div class="red-box"></div>
</body>
</html>
